[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
authors = ["SadCivilian"]

[lib]
crate-type = ["cdylib"]

[build]
target = "wasm32-unknown-unknown"

[dependencies]
sonus_macros = { path = "../sonus_macros" }
float-ord = "0.3.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg"]}
wasm-bindgen = "0.2.130"
palette = {version = "0.7.7", features = ["serializing"]}
console_error_panic_hook = "0.1.7"
web-sys = {version = "0.3.107", features = [
    "console",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "AudioBufferSourceNode",
    "AudioBufferOptions",
    "AudioBuffer",
    "AudioContext",
    "AudioContextState",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "BiquadFilterNode"
  ]
}

