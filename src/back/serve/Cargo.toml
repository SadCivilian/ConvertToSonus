[package]
name = "serve"
version = "0.1.0"
edition = "2024"
authors = ["SadCivilian"]

[[bin]]
name = "serve"
path = "src/main.rs"

[dependencies]
sonus_macros = {path = "../sonus_macros"}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
anyhow = "1.0.104" 
tokio = {version = "1.53.2", features = ["full"]} 
axum = {version = "0.8.9", features = ["tokio", "ws"]}
tower-http = {version = "0.7.1", features = ["fs"]}
